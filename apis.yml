name: Nook
description: >-
  Nook is an accounts payable (AP) automation platform for businesses,
  combining invoice management with automated payment workflows to reduce
  manual data entry, cut errors, and give finance teams clearer visibility over
  outgoings. Founded in the UK and backed by Speedinvest as an early investor,
  Nook was acquired by payments infrastructure provider Modulr; its product now
  operates as "Modulr AP" and its former standalone site at nook.io presents the
  combined Modulr AP offering. Nook does not publish an independent public
  developer platform, API reference, or SDKs — the payment rails are provided
  through Modulr's platform — so this profile is maintained as a company record
  rather than an API-bearing provider.
